services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: lab1bd_veterinaria
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d lab1bd_veterinaria"]
      interval: 2s
      retries: 60

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      - PORT=3000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=lab1bd_veterinaria
      - DB_USER=postgres
      - DB_PASSWORD=change_me
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      postgres_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  pgdata: